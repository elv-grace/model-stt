# Transcription-only tagger: faster-whisper (CTranslate2) running large-v3-turbo.
#
# Translation is deliberately out of scope. Everything supporting it is commented
# out rather than deleted; see "restoring translation" in README.md for the list.

storage:
  # Weight cache, populated by download_weights.py. Layout:
  #   <weights_dir>/faster-whisper/<model>/
  #   <weights_dir>/openai/*.pt          (bench only, never shipped in the image)
  # Images built with WEIGHTS != none bake these in and set WEIGHTS_DIR to point
  # at the baked copy; images built with WEIGHTS=none expect this path to be
  # mounted from the host instead.
  weights_dir: ~/.cache/model-stt/whisper

device: cuda

# Logical model name -> where each backend finds its weights.
#
# ct2:      directory under <weights_dir>/faster-whisper, else ct2_repo. Always an
#           explicit directory or repo id, never a bare size name: faster-whisper's
#           size-name -> repo mapping changes between library versions.
# openai:   file name under <weights_dir>/openai. Used only by the openai backend,
#           which the image does not install (setup.py extras). Must stay whisper's
#           canonical file name -- load_model() only resolves DTW alignment heads
#           when given a registered model *name*, not a path.
# translate: whether the weights support whisper's native X->en speech translation.
models:
  large-v3-turbo:
    openai: large-v3-turbo.pt
    ct2: large-v3-turbo
    ct2_repo: deepdml/faster-whisper-large-v3-turbo-ct2
    translate: false

  # DISABLED -- not shipped. large-v3 exists only for whisper's native translation
  # (path B), which measured worse than transcribe-then-LLM.
  # For transcription it is 2.6x slower than turbo with no reliable gain,
  # and on real media it was less stable (mid-file script switching, lost
  # punctuation). Uncomment to reproduce the bench comparisons.
  # large-v3:
  #   openai: large-v3.pt
  #   ct2: large-v3
  #   ct2_repo: Systran/faster-whisper-large-v3
  #   translate: true

# DISABLED with path B -- the model substituted in when translation was requested
# with weights that cannot translate.
# translate_fallback: large-v3

postprocessing:
  # Applied ONLY to a trailing run that reaches the end of the file with no
  # terminal punctuation -- the dropped-full-stop case, where there is no
  # punctuation to trust and a long silence is the best boundary evidence there is.
  sentence_gap: 5000

  # Backstop for whisper's degenerate no-punctuation decode, which once produced a
  # single 1595-word caption. A caption with more words than this is split at its
  # widest internal pause, repeatedly.
  # Keyed on word count, not duration. This is a safety valve, not a classifier.
  max_caption_words: 150

  punctuation:
    enabled: true
    # Same weights model-asr uses (src/pretty.py), so the two systems' sentence
    # boundaries are decided by the same model and stay comparable.
    model: oliverguhr/fullstop-punctuation-multilang-large
    window: 200
    stride: 150
    batch_size: 16
    # Whether the model may remove a full stop whisper emitted, merging two
    # captions. Off, and not a tuning knob. Measured, the worst merges are the
    # most confident ones, so no threshold separates them from the good ones.
    demote_terminal: false
    demote_confidence: 0.9
    # false => a missing or unloadable model logs a warning and falls back to
    # whisper's own punctuation. true => the tagger fails instead.
    required: false

runtime:
  default:
    backend: faster-whisper
    model_name: large-v3-turbo
    compute_type: float16
    language: null          # null => detect per file
    word_level: true
    sentence_level: true
    
    carry_context: false

    vad_filter: false
    condition_on_previous_text: false

    deterministic_fallback: true

    # faster-whisper's "skip silence before possible hallucinations" heuristic.
    # It fires on is_segment_anomaly -- words that are unusually long, short or improbable --
    # and when such a segment is bracketed by quiet it moves the decoder's seek
    # pointer past the audio entirely, so nothing about the skip is visible
    # downstream: no low-confidence segment, no repetition, just a gap.
    # Raise it to 4.0-8.0 for long live-action film with a lot of score and in-world radio, 
    # where the audio this deletes is real speech.
    # Do not raise it for animation or live sports, where 2.0 measured best.
    # Note the whole range spans ~1.5%, and disabling it entirely is ~25% faster
    # to decode because the skip re-decodes overlapping windows.
    hallucination_silence_threshold: 2.0

    # only consulted when a profile turns vad_filter back on
    vad_threshold: 0.25
    vad_min_silence_ms: 2000
    vad_speech_pad_ms: 2000

    # Isolated-artifact guard.
    # Surfaced here rather than left in RuntimeConfig because the three thresholds
    # decide whether real speech gets deleted, and the right values are
    # content-dependent. A file must contain at least `min_count` copies of the
    # same short text, that text must be isolated as a rule (median gap to its
    # nearest neighbour at or above `gap`), and only the copies that are
    # themselves isolated are dropped. Raise `gap` or `min_count` to be more
    # conservative; set `gap` to 0 to disable entirely.
    isolated_artifact_gap: 10.0
    isolated_artifact_max_words: 3
    isolated_artifact_min_count: 4

  # Whisper's original sampled retry ladder, which is NOT reproducible: the same
  # input gives different captions every run.
  # Kept because it is the upstream behaviour
  # and because its failure mode differs -- sampled retries produce fewer, longer,
  # more varied inventions where deterministic ones produce more short duplicates.
  # Reach for it only when reproducibility is not wanted and the isolated-artifact
  # guard is off; otherwise the default is strictly better here. It measured
  # 8-10% slower.
  stochastic:
    deterministic_fallback: false

  # Retained as an alias so existing callers passing {"profile": "reproducible"}
  # keep working. The default is now reproducible, so this sets nothing.
  reproducible: {}

  # VAD on, for content with distinguishable silence: scripted film and TV, studio
  # recordings, anything where speech is separated by real quiet rather than by a
  # score or a crowd. Suppresses the stock-phrase artifacts whisper emits over
  # non-speech, at the cost of dropping speech mixed into continuous noise.
  # Not Silero's own defaults (0.5 / 2000 / 400). At threshold 0.5 the filter drops
  # dialogue mixed under a loud score and speech_pad_ms doubles as the bridge that 
  # stops a short excision from splitting an utterance, 
  # since regions less than 2*pad apart merge. Raise the
  # threshold towards 0.5 only for sparse speech over steady noise.
  clean-audio:
    vad_filter: true
    vad_threshold: 0.25
    vad_min_silence_ms: 2000
    vad_speech_pad_ms: 2000
    condition_on_previous_text: true

# DISABLED -- ollama endpoint for path C (transcribe, then translate the sentence
# track with an LLM). Removing translation also removes this external dependency:
# with path C active, an unreachable host means no translation output at all.
# llm:
#   host: http://localhost:11434
#   model: llama3.3:70b
#   batch_size: 20
#   timeout: 300
